name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SIYS_SUPABASE_URL: ${{ vars.SIYS_SUPABASE_URL }}
      SIYS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SIYS_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run build
      - run: npm run audit
      - name: Verify generated distribution
        run: git diff --exit-code -- dist/
