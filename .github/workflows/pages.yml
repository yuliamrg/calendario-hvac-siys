name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIYS_SUPABASE_URL: ${{ vars.SIYS_SUPABASE_URL }}
      SIYS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SIYS_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve stable version
        id: stable
        shell: bash
        run: |
          stable_tag="$(tr -d '[:space:]' < stable-version.txt)"
          [[ "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$stable_tag" >> "$GITHUB_OUTPUT"
      - name: Checkout stable release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.stable.outputs.tag }}
          path: stable-src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install beta dependencies
        run: npm ci
      - name: Install stable dependencies
        working-directory: stable-src
        run: npm ci
      - name: Verify Supabase deployment configuration
        shell: bash
        run: |
          test -n "$SIYS_SUPABASE_URL"
          test -n "$SIYS_SUPABASE_PUBLISHABLE_KEY"
      - name: Verify beta source
        run: npm run verify
      - name: Verify stable source
        working-directory: stable-src
        run: npm run verify
      - name: Build dual-channel artifact
        shell: bash
        run: |
          mkdir -p pages/beta
          cp stable-src/dist/index.html pages/index.html
          cp stable-src/dist/calendario-hvac-siys.html pages/calendario-hvac-siys.html
          cp dist/index.html pages/beta/index.html
          cp dist/calendario-hvac-siys.html pages/beta/calendario-hvac-siys.html
          test -s pages/index.html
          test -s pages/beta/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
